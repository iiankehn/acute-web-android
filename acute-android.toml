[product]
name = "Acute Web"
application_id = "com.acuteweb.browser"
repository = "iiankehn/acute-web-android"

[channels.stable]
branch = "main"
application_id = "com.acuteweb.browser"
release_pattern = "vMAJOR.MINOR.PATCH"

[channels.beta]
branch = "beta"
application_id = "com.acuteweb.browser.beta"
release_pattern = "vMAJOR.MINOR.PATCH-beta.NUMBER"

[upstream]
repository = "https://github.com/mozilla-firefox/firefox.git"
ref = "4452e9a17a29f762c5af6326f45c000dcf3117bb"

[updates]
api = "https://api.github.com/repos/iiankehn/acute-web-android/releases/latest"
check_interval_hours = 24

[privacy]
telemetry = false
crash_reporting = false
