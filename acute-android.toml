[product]
name = "Acute Web"
application_id = "com.acuteweb.browser"
repository = "iiankehn/acute-web-android"

[release]
candidate = "2.0.0-beta.1"

[channels.stable]
branch = "main"
application_id = "com.acuteweb.browser"
release_pattern = "vMAJOR.MINOR.PATCH"

[channels.beta]
branch = "beta"
application_id = "com.acuteweb.browser.beta"
release_pattern = "vMAJOR.MINOR.PATCH-beta.NUMBER"

[channels.dev]
branch = "dev"
application_id = "com.acuteweb.browser.dev"
release_pattern = "CI artifacts only; 2.0.0-dev.NUMBER"

[upstream]
repository = "https://github.com/mozilla-firefox/firefox.git"
ref = "08d23041955657e661eef22c8fdc967735300233"

[updates]
api = "https://api.github.com/repos/iiankehn/acute-web-android/releases/latest"
beta_api = "https://api.github.com/repos/iiankehn/acute-web-android/releases?per_page=20"
check_interval_hours = 6

[privacy]
telemetry = false
crash_reporting = false
