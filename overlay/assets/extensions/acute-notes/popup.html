<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Notes</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">ACUTE</span>
        <h1>Page Notes</h1>
        <p id="page-title">Attach a private note to this page.</p>
      </header>
      <form id="note-form">
        <label for="note">Note for this page</label>
        <textarea id="note" maxlength="5000" rows="7" placeholder="Add context, a reminder, or an idea…"></textarea>
        <div class="form-actions">
          <span id="count">0 / 5000</span>
          <button type="submit">Save note</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="recent-heading">
        <h2 id="recent-heading">Recent notes</h2>
        <div id="empty-state">No page notes yet.</div>
        <ul id="notes"></ul>
      </section>
      <p class="privacy">Notes and page addresses stay on this device.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
