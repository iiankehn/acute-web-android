name: Validate overlay

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make audit
      - run: make upstream-check

  windows-audit:
    name: Audit on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Check audit prerequisites
        run: |
          set -euo pipefail
          python --version
          node --version
          java com.sun.tools.javac.Main -version
          git --version
          bash --version
      - name: Run the complete local audit without Make
        run: |
          set -euo pipefail
          python scripts/check_project.py
          python -m unittest discover -s tests -v
          node --test tests/extensions.test.cjs
          python -m compileall -q -f scripts tests
          python scripts/audit_project.py
