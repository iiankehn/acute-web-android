name: Sync Acute branding
on:
  push:
    branches: [main, beta]
    paths:
      - ".github/workflows/sync-branding.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select approved clear branding
        shell: bash
        run: |
          set -euo pipefail
          STABLE="https://raw.githubusercontent.com/iiankehn/acute-web-ios/main/AcuteWeb/Assets.xcassets/AppIcon.appiconset/AcuteWebIcon-Clear.png"
          BETA="https://raw.githubusercontent.com/iiankehn/acute-web-ios/main/AcuteWeb/Assets.xcassets/BetaAppIcon.appiconset/AcuteWebBetaIcon-Clear.png"
          APP="$STABLE"
          if [[ "${GITHUB_REF_NAME}" == "beta" ]]; then APP="$BETA"; fi
          curl --fail --location "$APP" -o overlay/res/drawable-nodpi/acute_brand_mark.png
          curl --fail --location "$APP" -o overlay/res/drawable-nodpi/acute_brand_monochrome.png
          curl --fail --location "$STABLE" -o docs/acute-mark.png
      - name: Commit synchronized branding
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay/res/drawable-nodpi/acute_brand_mark.png overlay/res/drawable-nodpi/acute_brand_monochrome.png docs/acute-mark.png
          git commit -m "Apply approved Acute clear branding"
          git push
