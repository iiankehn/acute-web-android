name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      firefox_ref:
        description: Audited Mozilla Firefox commit (manual test builds only)
        required: true
        default: 4452e9a17a29f762c5af6326f45c000dcf3117bb
  push:
    branches:
      - beta
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  PINNED_FIREFOX_REF: 4452e9a17a29f762c5af6326f45c000dcf3117bb

jobs:
  audit:
    name: Audit Acute source and release controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Acute source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run complete Acute audit suite
        run: make audit

  build:
    name: Build without release secrets
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      package: ${{ steps.version.outputs.package }}
      channel: ${{ steps.version.outputs.channel }}
      firefox_ref: ${{ steps.version.outputs.firefox_ref }}
      task: ${{ steps.version.outputs.task }}
      gradle_flags: ${{ steps.version.outputs.gradle_flags }}
    steps:
      - name: Check out Acute overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: acute-overlay
          persist-credentials: false

      - name: Select immutable build inputs
        id: version
        env:
          MANUAL_FIREFOX_REF: ${{ inputs.firefox_ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              channel=stable
              task=fenix:assembleRelease
              kind=release
              package=com.acuteweb.browser
            elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              channel=beta
              task=fenix:assembleBeta
              kind=beta
              package=com.acuteweb.browser.beta
            else
              echo "Tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.NUMBER"
              exit 1
            fi
            echo "task=$task" >> "$GITHUB_OUTPUT"
            echo "gradle_flags=-PlocalProperties.disableDebugSigning=true" >> "$GITHUB_OUTPUT"
            echo "kind=$kind" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "package=$package" >> "$GITHUB_OUTPUT"
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "firefox_ref=$PINNED_FIREFOX_REF" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              [[ "$MANUAL_FIREFOX_REF" =~ ^[0-9a-f]{40}$ ]] || {
                echo "Manual builds require a full 40-character Firefox commit"
                exit 1
              }
              firefox_ref="$MANUAL_FIREFOX_REF"
            else
              firefox_ref="$PINNED_FIREFOX_REF"
            fi
            if [[ "$GITHUB_REF" == "refs/heads/beta" ]]; then
              echo "task=fenix:assembleBeta" >> "$GITHUB_OUTPUT"
              echo "kind=beta" >> "$GITHUB_OUTPUT"
              # Keep branch builds parseable by the GitHub updater. The
              # monotonically increasing ACUTE_BUILD_NUMBER still permits
              # install-over updates between Beta artifacts.
              echo "version=1.0.0-beta.1" >> "$GITHUB_OUTPUT"
              echo "package=com.acuteweb.browser.beta" >> "$GITHUB_OUTPUT"
              echo "channel=beta" >> "$GITHUB_OUTPUT"
            else
              echo "task=fenix:assembleDebug" >> "$GITHUB_OUTPUT"
              echo "kind=debug" >> "$GITHUB_OUTPUT"
              echo "version=1.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "package=com.acuteweb.browser.debug" >> "$GITHUB_OUTPUT"
              echo "channel=stable" >> "$GITHUB_OUTPUT"
            fi
            echo "gradle_flags=" >> "$GITHUB_OUTPUT"
            echo "firefox_ref=$firefox_ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Bound Gradle memory and configure swap
        run: |
          swap_file="$RUNNER_TEMP/acute-build.swap"
          sudo fallocate -l 4G "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          if ! sudo swapon "$swap_file"; then
            echo "Swap is unavailable; continuing with bounded Gradle memory"
            sudo rm -f "$swap_file"
          fi
          free -h
          df -h "$RUNNER_TEMP"

      - name: Check out pinned Firefox source
        env:
          FIREFOX_REF: ${{ steps.version.outputs.firefox_ref }}
        run: |
          git init firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C firefox fetch --depth=1 origin "$FIREFOX_REF"
          test "$(git -C firefox rev-parse FETCH_HEAD)" = "$FIREFOX_REF"
          git -C firefox checkout --detach FETCH_HEAD

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Bootstrap Firefox Android artifact build
        working-directory: firefox
        run: python3 ./mach bootstrap --application-choice mobile_android_artifact_mode

      - name: Target ARM64 Android devices
        working-directory: firefox
        run: |
          printf '\n# Acute Web release target\nac_add_options --target=aarch64-linux-android\n' >> mozconfig

      - name: Configure Firefox Android build
        working-directory: firefox
        run: ./mach configure --enable-bootstrap=no-update

      - name: Build Firefox Android artifacts
        working-directory: firefox
        run: ./mach build

      - name: Apply Acute Web overlay
        run: python3 acute-overlay/scripts/apply_overlay.py firefox --channel "${{ steps.version.outputs.channel }}"

      - name: Verify privacy flags and minimized permissions
        run: |
          gradle=firefox/mobile/android/fenix/app/build.gradle
          manifest=firefox/mobile/android/fenix/app/src/main/AndroidManifest.xml
          ! grep -E "TELEMETRY['\", ]+true|CRASH_REPORTING['\", ]+true" "$gradle"
          ! grep -q 'com.adjust.preinstall.READ_PERMISSION' "$manifest"
          ! grep -q 'com.google.android.gms.permission.AD_ID' "$manifest"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$manifest"
          ! grep -q 'android.permission.REQUEST_DELETE_PACKAGES' "$manifest"
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"

      - name: Build APK without release credentials
        working-directory: firefox
        env:
          ACUTE_VERSION_NAME: ${{ steps.version.outputs.version }}
          ACUTE_BUILD_NUMBER: ${{ github.run_number }}
          GRADLE_FLAGS: ${{ steps.version.outputs.gradle_flags }}
          GRADLE_TASK: ${{ steps.version.outputs.task }}
        run: |
          gradle_resource_args=(
            --no-parallel
            --max-workers=2
            '-Dorg.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC'
          )
          # Fenix's final vital-lint analysis stalled until the three-hour job
          # timeout on the 0.7 Beta build. Package the APK without that task;
          # the prior signed Beta build completed it on the same Firefox pin.
          if [[ "$GRADLE_TASK" == *assembleBeta ]]; then
            variant=Beta
          elif [[ "$GRADLE_TASK" == *assembleRelease ]]; then
            variant=Release
          else
            variant=
          fi
          if [[ -n "$variant" ]]; then
            gradle_resource_args+=(
              -x ":fenix:lintVital${variant}"
            )
          fi
          for attempt in 1 2 3; do
            ./mach gradle "$GRADLE_TASK" $GRADLE_FLAGS "${gradle_resource_args[@]}" && break
            test "$attempt" -lt 3 || exit 1
            echo "Gradle dependency resolution failed; retrying in 30 seconds"
            sleep 30
          done

      - name: Collect and verify ARM64 APK
        env:
          BUILD_KIND: ${{ steps.version.outputs.kind }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          apk="$(find firefox -type f -path "*/fenix/app/outputs/apk/$BUILD_KIND/*universal*.apk" -print -quit)"
          test -n "$apk" || { echo "APK not found"; find firefox -type f -name '*.apk' -print; exit 1; }
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libmozglue.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libxul.so'
          cp "$apk" "dist/acute-web-${VERSION}-arm64-v8a-unsigned.apk"
          printf 'Acute version: %s\nFirefox commit: %s\nAcute commit: %s\n' \
            "$VERSION" "${{ steps.version.outputs.firefox_ref }}" "$GITHUB_SHA" > dist/build-inputs.txt

      - name: Upload unsigned build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acute-web-${{ steps.version.outputs.version }}-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and verify installable APK
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/beta')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acute-web-${{ needs.build.outputs.version }}-unsigned
          path: unsigned

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Sign with isolated release credentials
        env:
          ACUTE_KEYSTORE_B64: ${{ secrets.ACUTE_KEYSTORE_B64 }}
          ACUTE_KEYSTORE_PASSWORD: ${{ secrets.ACUTE_KEYSTORE_PASSWORD }}
          ACUTE_KEY_ALIAS: ${{ secrets.ACUTE_KEY_ALIAS }}
          ACUTE_KEY_PASSWORD: ${{ secrets.ACUTE_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$ACUTE_KEYSTORE_B64"
          test -n "$ACUTE_KEYSTORE_PASSWORD"
          test -n "$ACUTE_KEY_ALIAS"
          test -n "$ACUTE_KEY_PASSWORD"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt2"
          printf '%s' "$ACUTE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/acute-web-release.jks"
          chmod 600 "$RUNNER_TEMP/acute-web-release.jks"
          mkdir -p dist
          unsigned_apk="$(find unsigned -name '*-unsigned.apk' -print -quit)"
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/acute-web-release.jks" \
            --ks-key-alias "$ACUTE_KEY_ALIAS" \
            --ks-pass "env:ACUTE_KEYSTORE_PASSWORD" \
            --key-pass "env:ACUTE_KEY_PASSWORD" \
            --out "dist/acute-web-${VERSION}-arm64-v8a.apk" \
            "$RUNNER_TEMP/aligned.apk"
          signing_report="$("$build_tools/apksigner" verify --verbose --print-certs "dist/acute-web-${VERSION}-arm64-v8a.apk")"
          printf '%s\n' "$signing_report" | tee dist/signing-certificate.txt
          permissions_report="$("$build_tools/aapt2" dump permissions "dist/acute-web-${VERSION}-arm64-v8a.apk")"
          printf '%s\n' "$permissions_report" | tee dist/manifest-permissions.txt
          ! grep -q 'com.adjust.preinstall.READ_PERMISSION' dist/manifest-permissions.txt
          ! grep -q 'com.google.android.gms.permission.AD_ID' dist/manifest-permissions.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' dist/manifest-permissions.txt
          ! grep -q 'android.permission.REQUEST_DELETE_PACKAGES' dist/manifest-permissions.txt
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' dist/manifest-permissions.txt
          sha256sum "dist/acute-web-${VERSION}-arm64-v8a.apk" > "dist/acute-web-${VERSION}-arm64-v8a.apk.sha256"
          cp unsigned/build-inputs.txt dist/build-inputs.txt
          rm -f "$RUNNER_TEMP/acute-web-release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Verify signing continuity with v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p previous
          gh release download v0.2.0 --pattern '*.apk' --dir previous
          previous_apk="$(find previous -name '*.apk' -print -quit)"
          current_apk="$(find dist -name '*.apk' -print -quit)"
          certificate_digest() {
            "$build_tools/apksigner" verify --verbose --print-certs "$1" \
              | sed -n -E 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' \
              | head -1
          }
          previous_digest="$(certificate_digest "$previous_apk")"
          current_digest="$(certificate_digest "$current_apk")"
          test -n "$previous_digest"
          test -n "$current_digest"
          printf 'Previous signer: %s\nCurrent signer:  %s\n' "$previous_digest" "$current_digest"
          test "$current_digest" = "$previous_digest"

      - name: Upload signed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acute-web-${{ needs.build.outputs.version }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acute-web-${{ needs.build.outputs.version }}-signed
          path: dist

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets | length')"
            test "$asset_count" = "0" || {
              echo "Release $GITHUB_REF_NAME already contains assets; refusing to replace published files"
              exit 1
            }
            gh release upload "$GITHUB_REF_NAME" dist/*
          else
            prerelease=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              "${prerelease[@]}" \
              --title "Acute Web $GITHUB_REF_NAME"
          fi

  update-website:
    name: Publish release links to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the Stable website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Read the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | jq --arg repository "$GITHUB_REPOSITORY" \
              '{repository: {full_name: $repository}, release: .}' \
            > "$RUNNER_TEMP/acute-release.json"

      - name: Validate release and update website metadata
        run: >-
          python3 scripts/update_site_release.py
          --event "$RUNNER_TEMP/acute-release.json"
          --html docs/index.html

      - name: Validate generated website
        run: |
          git diff --check
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Commit website update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Website already matches ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Update website for ${RELEASE_TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
